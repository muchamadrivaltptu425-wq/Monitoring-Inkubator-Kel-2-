<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kelompok 2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f4f8; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .header { background: #1a365d; color: white; padding: 25px; text-align: center; border-bottom: 5px solid #38a169; margin-bottom: 25px; }
        .card-custom { color: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 15px;}
        .data-value { font-size: 2.5rem; font-weight: bold; margin-top: 5px; }
        .section-title { font-weight: 700; color: #2d3748; border-left: 5px solid #38a169; padding-left: 10px; margin: 25px 0 15px 0; text-transform: uppercase; font-size: 1.1rem;}
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <div class="header">
        <h2 class="fw-bold">SMART MONITORING SYSTEM</h2>
        <p class="mb-0">Penetas Telur IoT - Kelompok 2</p>
    </div>

    <div class="container">
        <div class="panel mb-4">
            <div class="row align-items-center">
                <div class="col-md-4">
                    <label class="small fw-bold">IP ESP32 (Auto-Detected):</label>
                    <input type="text" id="esp-ip" class="form-control fw-bold text-primary" placeholder="Mencari IP...">
                </div>
                <div class="col-md-8 d-flex justify-content-end gap-2 mt-3 mt-md-0">
                    <button class="btn btn-warning fw-bold text-dark" onclick="sendCmd('/servo')">⚙️ PUTAR RAK MANUAL</button>
                    <button id="btn-logging" class="btn btn-secondary fw-bold" onclick="toggleLogging()">⌛ CEK STATUS...</button>
                    <button class="btn btn-success fw-bold" onclick="window.open('https://docs.google.com/spreadsheets/d/1UjvYADIU_KLuU5A5py79MUlr33sPx85IPz9HD1Pppys/edit')">📊 G-SHEETS</button>
                </div>
            </div>
        </div>

        <h5 class="section-title">MONITORING REALTIME (LIVE)</h5>
        <div class="row g-3">
            <div class="col-md-3"><div class="card-custom bg-danger"><h6>SUHU</h6><div class="data-value"><span id="v-suhu">--</span>°C</div></div></div>
            <div class="col-md-3"><div class="card-custom bg-primary"><h6>KELEMBAPAN</h6><div class="data-value"><span id="v-hum">--</span>%</div></div></div>
            <div class="col-md-3"><div class="card-custom bg-warning text-dark"><h6>HEATER</h6><div class="data-value" id="v-heater">--</div></div></div>
            <div class="col-md-3"><div class="card-custom bg-dark"><h6>COOLING FAN</h6><div class="data-value" id="v-fan">--</div></div></div>
        </div>

        <h5 class="section-title">GRAFIK PENGUKURAN (TIAP 10 MENIT)</h5>
        <div class="panel">
            <canvas id="liveChart" style="width: 100%; height: 350px;"></canvas>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <h5 class="section-title">MANAJEMEN SD CARD</h5>
                <div class="panel d-flex gap-2">
                    <button class="btn btn-outline-info fw-bold w-100" onclick="sendCmd('/status')">ℹ️ STATUS</button>
                    <button class="btn btn-outline-primary fw-bold w-100" onclick="downloadSD()">💾 DOWNLOAD</button>
                    <button class="btn btn-outline-danger fw-bold w-100" onclick="confirmReset()">🗑️ RESET</button>
                </div>
            </div>
            <div class="col-md-6">
                <h5 class="section-title">FILTER DATA HISTORI</h5>
                <div class="panel d-flex gap-2">
                    <input type="date" id="filter-date" class="form-control">
                    <button class="btn btn-dark fw-bold px-4" onclick="filterHistory()">CARI</button>
                </div>
            </div>
        </div>

        <h5 class="section-title">HISTORI DATA (GOOGLE SHEETS)</h5>
        <div class="panel mb-5 table-responsive">
            <table class="table table-hover text-center">
                <thead class="table-dark">
                    <tr><th>Timestamp</th><th>Suhu (°C)</th><th>Kelembapan (%)</th><th>Heater</th><th>Fan</th></tr>
                </thead>
                <tbody id="t-body">
                    <tr><td colspan="5">Memuat histori data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyxtu0ce0M3Hu0Az11P-SGnNRKd8PfJyQ1NoScQlp7Oz1OG0kNgwbiH6gR6q_yzKF7KrQ/exec"; 
        let liveChart;

        // FUNGSI KONTROL ESP32
        function sendCmd(path) {
            const ip = document.getElementById('esp-ip').value;
            if(!ip || ip.includes("Mencari")) return alert("IP belum siap!");
            fetch(`http://${ip}${path}`, { method: 'POST' })
                .then(r => r.text())
                .then(t => alert("Respons: " + t))
                .catch(e => alert("Gagal koneksi. Pastikan ESP32 & Laptop di WiFi yang sama!"));
        }

        function downloadSD() {
            const ip = document.getElementById('esp-ip').value;
            if(ip) window.open(`http://${ip}/download`, '_blank');
        }

        function confirmReset() { if(confirm("Hapus data di SD Card?")) sendCmd('/hapusdata'); }

        function toggleLogging() {
            const btn = document.getElementById('btn-logging');
            let newState = btn.innerText.includes("START") ? "ON" : "OFF";
            btn.innerText = "Memproses...";
            fetch(`${GAS_URL}?action=toggle&value=${newState}`).then(() => fetchHistoryAndGraph());
        }

        // INIT GRAFIK
        function initChart() {
            const ctx = document.getElementById('liveChart').getContext('2d');
            liveChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Suhu (°C)', borderColor: '#e53e3e', backgroundColor: 'rgba(229, 62, 62, 0.1)', data: [], tension: 0.3, fill: true },
                        { label: 'Kelembapan (%)', borderColor: '#3182ce', backgroundColor: 'rgba(49, 130, 206, 0.1)', data: [], tension: 0.3, fill: true }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // AMBIL DATA LIVE DARI ESP32 (YANG MENGISI KOTAK WARNA-WARNI)
        function fetchRealtime() {
            const ip = document.getElementById('esp-ip').value;
            // Hanya jalan kalau IP sudah berbentuk angka dari G-Sheets
            if(!ip || ip.includes("Mencari")) return;
            
            fetch(`http://${ip}/data`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('v-suhu').innerText = d.suhu;
                    document.getElementById('v-hum').innerText = d.kelembapan;
                    document.getElementById('v-heater').innerText = d.heater;
                    document.getElementById('v-fan').innerText = d.fan;
                })
                .catch(e => console.log("Menunggu koneksi langsung ke ESP32..."));
        }

        // AMBIL DATA HISTORI & IP DARI GOOGLE SHEETS
        function fetchHistoryAndGraph() {
            fetch(`${GAS_URL}?read=true`)
                .then(r => r.json())
                .then(res => {
                    // Update IP
                    if(res.ip) document.getElementById('esp-ip').value = res.ip;

                    // Update Tombol Status
                    const btn = document.getElementById('btn-logging');
                    if(res.logging === "ON") {
                        btn.innerText = "⏹️ STOP LOGGING"; btn.className = "btn btn-danger fw-bold";
                    } else {
                        btn.innerText = "▶️ START LOGGING"; btn.className = "btn btn-success fw-bold";
                    }

                    // Pastikan data histori ada sebelum update tabel
                    if(res.logs && res.logs.length > 0) {
                        let html = "";
                        const dataReversed = [...res.logs].reverse().slice(0, 10);
                        dataReversed.forEach(row => {
                            html += `<tr><td>${row.waktu}</td><td>${row.suhu}</td><td>${row.kelembapan}</td>
                                     <td><span class="badge ${row.heater=='ON'?'bg-warning text-dark':'bg-secondary'}">${row.heater}</span></td>
                                     <td><span class="badge ${row.fan=='ON'?'bg-dark':'bg-secondary'}">${row.fan}</span></td></tr>`;
                        });
                        document.getElementById('t-body').innerHTML = html;

                        // Update Grafik
                        const chartData = res.logs.slice(-20);
                        liveChart.data.labels = chartData.map(d => d.waktu.split(' ')[1] || d.waktu);
                        liveChart.data.datasets[0].data = chartData.map(d => d.suhu);
                        liveChart.data.datasets[1].data = chartData.map(d => d.kelembapan);
                        liveChart.update();
                    }
                })
                .catch(e => console.error("Proses sinkronisasi Google Sheets tertunda..."));
        }

        // FUNGSI FILTER TANGGAL (Kosongan agar tombol tidak error, logika bisa dikembangkan nanti)
        function filterHistory() {
            alert("Fitur filter tanggal memuat ulang data G-Sheets...");
            fetchHistoryAndGraph(); 
        }

        // JALANKAN SAAT HALAMAN DIBUKA
        window.onload = () => {
            initChart();
            fetchHistoryAndGraph(); // Ambil IP dan Histori dari G-Sheets
            setInterval(fetchRealtime, 2000); // Ambil Suhu Live tiap 2 detik
            setInterval(fetchHistoryAndGraph, 15000); // Sinkron G-Sheets tiap 15 detik
        };
    </script>
</body>
</html>
